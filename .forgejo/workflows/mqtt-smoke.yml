name: MQTT smoke test

on:
  workflow_dispatch:

jobs:
  mqtt-smoke:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MQTT_ADMIN_PASSWORD: ${{ secrets.MQTT_ADMIN_PASSWORD }}
          MQTT_INGESTOR_USERNAME: ${{ secrets.MQTT_INGESTOR_USERNAME }}
          MQTT_INGESTOR_PASSWORD: ${{ secrets.MQTT_INGESTOR_PASSWORD }}
          INGESTION_REGISTRY_API_KEY: ${{ secrets.INGESTION_REGISTRY_API_KEY }}
        run: |
          set -eu
          services="database mosquitto backend"
          if [ -f ingestion/go.mod ]; then
            services="$services ingestion"
          fi
          docker compose up -d --build $services

      - name: Install smoke-test dependencies
        run: python3 -m pip install -r tests/mqtt-smoke/requirements.txt

      - name: Run authenticated telemetry smoke test
        env:
          MQTT_USERNAME: ${{ secrets.MQTT_INGESTOR_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_INGESTOR_PASSWORD }}
          DEVICE_ID: ${{ secrets.SMOKE_DEVICE_ID }}
          SENSOR_VALUES_JSON: ${{ secrets.SMOKE_SENSOR_VALUES_JSON }}
          DATABASE_NAME: ${{ secrets.POSTGRES_DB }}
          DATABASE_USER: ${{ secrets.POSTGRES_USER }}
          DATABASE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: python3 tests/mqtt-smoke/smoke.py

      - name: Stop stack
        if: always()
        run: docker compose down -v
