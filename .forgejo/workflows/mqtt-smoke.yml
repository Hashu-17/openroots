name: MQTT smoke test (Forgejo)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openroots-mqtt-smoke
  cancel-in-progress: false

jobs:
  mqtt-smoke:
    runs-on: openroots-smoke
    env:
      MQTT_SMOKE_DEVICE_ID: ${{ secrets.MQTT_SMOKE_DEVICE_ID }}
      MQTT_SMOKE_DEVICE_PASSWORD: ${{ secrets.MQTT_SMOKE_DEVICE_PASSWORD }}
      OPENROOTS_MQTT_HOST: 127.0.0.1
      OPENROOTS_MQTT_PORT: 1883
      OPENROOTS_API_URL: http://127.0.0.1:8080
      MQTT_SMOKE_CHANNEL: temperature
      MQTT_SMOKE_TIMEOUT: 30
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Check dependencies and local OpenRoots stack
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          command -v docker
          command -v curl
          docker inspect --format '{{.State.Running}}' openroots-mosquitto | grep -Fx true
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
          test -n "$MQTT_SMOKE_DEVICE_ID"
          test -n "$MQTT_SMOKE_DEVICE_PASSWORD"

      - name: Create Python environment and install MQTT client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-forgejo-mqtt-smoke
          .venv-forgejo-mqtt-smoke/bin/python -m pip install -r examples/requirements-mqtt.txt

      - name: Provision smoke-test broker account
        shell: bash
        run: bash examples/provision_mqtt_device.sh

      - name: Publish telemetry and verify backend persistence
        shell: bash
        run: .venv-forgejo-mqtt-smoke/bin/python examples/mqtt_smoke_test.py
