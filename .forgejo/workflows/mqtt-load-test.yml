name: MQTT load test (Forgejo)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Existing project UUID (leave blank to use the smoke-test device's project)
        required: false
        default: ''
        type: string
      device_count:
        description: Number of virtual MQTT devices
        required: true
        default: 100
        type: number
      period_seconds:
        description: Seconds between each device's messages
        required: true
        default: 10
        type: number
      duration_seconds:
        description: Test duration in seconds
        required: true
        default: 300
        type: number

permissions:
  contents: read

concurrency:
  group: openroots-mqtt-load-test
  cancel-in-progress: false

jobs:
  load-test:
    runs-on: openroots-smoke
    env:
      OPENROOTS_API_URL: http://127.0.0.1:8080
      OPENROOTS_PROJECT_ID: ${{ inputs.project_id }}
      OPENROOTS_MQTT_DEVICE_PASSWORD: ${{ secrets.MQTT_LOAD_DEVICE_PASSWORD }}
      MQTT_SMOKE_DEVICE_ID: ${{ secrets.MQTT_SMOKE_DEVICE_ID }}
      OPENROOTS_MQTT_HOST: 127.0.0.1
      OPENROOTS_MQTT_PORT: 1883
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Check dependencies, secrets, and local OpenRoots stack
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          command -v docker
          command -v curl
          docker inspect --format '{{.State.Running}}' openroots-mosquitto | grep -Fx true
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
          test -n "$MQTT_SMOKE_DEVICE_ID"
          if [ -z "$OPENROOTS_MQTT_DEVICE_PASSWORD" ]; then
            echo 'Add the MQTT_LOAD_DEVICE_PASSWORD repository secret in Forgejo Settings → Actions → Secrets.' >&2
            exit 1
          fi

      - name: Create Python environment and install MQTT client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-forgejo-mqtt-load
          .venv-forgejo-mqtt-load/bin/python -m pip install -r examples/requirements-mqtt.txt

      - name: Create or reuse test devices and MQTT accounts
        shell: bash
        run: |
          set -euo pipefail
          .venv-forgejo-mqtt-load/bin/python examples/provision_mqtt_fleet.py \
            --count '${{ inputs.device_count }}'

      - name: Run synchronized MQTT load
        shell: bash
        run: |
          set -euo pipefail
          .venv-forgejo-mqtt-load/bin/python examples/mqtt_load_test.py \
            --devices examples/load-devices.txt \
            --period '${{ inputs.period_seconds }}' \
            --duration '${{ inputs.duration_seconds }}'
