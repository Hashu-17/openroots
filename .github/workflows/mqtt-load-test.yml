name: MQTT load test

# Manual only: it needs the local stack running on the self-hosted runner and
# writes thousands of telemetry rows, so it must never run on push or PR.
on:
  workflow_dispatch:
    inputs:
      implementation:
        description: Ingestion service under test (labels results; go also samples openroots-ingestion)
        required: true
        default: spring
        type: choice
        options: [spring, go]
      project_id:
        description: Existing project UUID (leave blank to use the smoke-test device's project)
        required: false
        default: ''
        type: string
      device_count:
        description: Number of virtual MQTT devices
        required: true
        default: 100
        type: number
      mqtt_host:
        description: Broker address reachable from this Windows runner
        required: true
        default: 127.0.0.1
        type: string
      mqtt_port:
        description: Published MQTT port
        required: true
        default: 1883
        type: number
      period_seconds:
        description: Seconds between each device's messages
        required: true
        default: 10
        type: number
      duration_seconds:
        description: Measured test duration in seconds (after warm-up)
        required: true
        default: 300
        type: number
      warmup_seconds:
        description: Warm-up traffic before measurement starts (excluded from stats)
        required: true
        default: 30
        type: number
      schedule:
        description: synchronized (all devices at once) or staggered (spread over the period)
        required: true
        default: synchronized
        type: choice
        options: [synchronized, staggered]
      repeats:
        description: Number of back-to-back runs (use 3 for a Spring vs Go comparison)
        required: true
        default: 3
        type: number

permissions:
  contents: read

concurrency:
  group: mqtt-load-test-windows
  cancel-in-progress: false

jobs:
  load-test:
    runs-on: [self-hosted, Windows, X64, openroots-smoke]
    env:
      OPENROOTS_API_URL: http://127.0.0.1:8080
      OPENROOTS_PROJECT_ID: ${{ inputs.project_id }}
      OPENROOTS_LOAD_DB_DSN: ${{ secrets.MQTT_LOAD_DB_DSN }}
      # Fleet setup signs in as this user (project OWNER or ADMIN) and issues each device
      # a temporary credential; the cleanup step revokes them. No device password is stored.
      OPENROOTS_API_EMAIL: ${{ secrets.MQTT_SMOKE_USER_EMAIL }}
      OPENROOTS_API_PASSWORD: ${{ secrets.MQTT_SMOKE_USER_PASSWORD }}
      MQTT_SMOKE_DEVICE_ID: ${{ secrets.MQTT_SMOKE_DEVICE_ID }}
      OPENROOTS_MQTT_HOST: ${{ inputs.mqtt_host || '127.0.0.1' }}
      OPENROOTS_MQTT_PORT: ${{ inputs.mqtt_port || 1883 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm local OpenRoots stack is running
        shell: cmd
        run: |
          set "MOSQUITTO_RUNNING="
          for /f "delims=" %%S in ('docker inspect --format "{{.State.Running}}" openroots-mosquitto 2^>nul') do set "MOSQUITTO_RUNNING=%%S"
          if /i not "%MOSQUITTO_RUNNING%"=="true" (
            echo This runner's Docker context does not see openroots-mosquitto as running.
            echo Docker context:
            docker context show
            echo Containers visible to this runner:
            docker ps -a --format "table {{.Names}}\t{{.Status}}"
            exit /b 1
          )
          curl.exe --fail --silent --show-error http://127.0.0.1:8080/actuator/health >nul
          if errorlevel 1 (
            echo OpenRoots backend is not responding at http://127.0.0.1:8080.
            exit /b 1
          )

      - name: Confirm the stack matches the selected implementation
        if: inputs.implementation == 'go'
        shell: cmd
        run: |
          set "INGESTION_RUNNING="
          for /f "delims=" %%S in ('docker inspect --format "{{.State.Running}}" openroots-ingestion 2^>nul') do set "INGESTION_RUNNING=%%S"
          if /i not "%INGESTION_RUNNING%"=="true" (
            echo implementation=go, but the openroots-ingestion container is not running.
            echo Start the stack from the go-mqtt-ingestion branch first.
            exit /b 1
          )

      - name: Check load-test secrets
        shell: cmd
        run: |
          set "MISSING="
          if not defined OPENROOTS_LOAD_DB_DSN set "MISSING=%MISSING% MQTT_LOAD_DB_DSN"
          if not defined OPENROOTS_API_EMAIL set "MISSING=%MISSING% MQTT_SMOKE_USER_EMAIL"
          if not defined OPENROOTS_API_PASSWORD set "MISSING=%MISSING% MQTT_SMOKE_USER_PASSWORD"
          if defined MISSING (
            echo Add these repository secrets in GitHub Settings:%MISSING%
            exit /b 1
          )

      - name: Create Python environment and install MQTT client
        shell: cmd
        env:
          # Set repo variable SMOKE_PYTHON (Settings > Variables) to a python.exe
          # the runner service account can read; otherwise python on PATH is used.
          SMOKE_PYTHON: ${{ vars.SMOKE_PYTHON }}
        run: |
          if "%SMOKE_PYTHON%"=="" (
            for /f "delims=" %%i in ('where python 2^>nul') do if not defined SMOKE_PYTHON set "SMOKE_PYTHON=%%i"
          )
          if "%SMOKE_PYTHON%"=="" (
            echo Python not found. Set the SMOKE_PYTHON repo variable or put python on the runner PATH.
            exit /b 1
          )
          if not exist "%SMOKE_PYTHON%" (
            echo Python not found at %SMOKE_PYTHON%
            exit /b 1
          )
          "%SMOKE_PYTHON%" -m venv .venv-mqtt-load
          .venv-mqtt-load\Scripts\python.exe -m pip install -r tests/support/mqtt/requirements-mqtt.txt

      - name: Create or reuse test devices and issue temporary credentials
        shell: powershell
        env:
          COUNT: ${{ inputs.device_count || 100 }}
          REPEATS: ${{ inputs.repeats || 3 }}
          DURATION: ${{ inputs.duration_seconds || 300 }}
          WARMUP: ${{ inputs.warmup_seconds || 30 }}
        run: |
          # Credentials must outlive every repeat: warm-up, measured time, and about
          # two minutes per run to connect, wait for PUBACKs and drain the database.
          $runSeconds = [int]$env:REPEATS * ([int]$env:WARMUP + [int]$env:DURATION + 120)
          & .venv-mqtt-load\Scripts\python.exe tests/support/mqtt/provision_mqtt_fleet.py `
            --count $env:COUNT --run-seconds $runSeconds
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run MQTT load and verify persistence
        shell: powershell
        env:
          IMPLEMENTATION: ${{ inputs.implementation }}
          REPEATS: ${{ inputs.repeats || 3 }}
          PERIOD: ${{ inputs.period_seconds || 10 }}
          DURATION: ${{ inputs.duration_seconds || 300 }}
          WARMUP: ${{ inputs.warmup_seconds || 30 }}
          SCHEDULE: ${{ inputs.schedule || 'synchronized' }}
        run: |
          $containers = 'iot-backend,iot-database,openroots-mosquitto'
          if ($env:IMPLEMENTATION -eq 'go') { $containers += ',openroots-ingestion' }
          $failed = 0
          for ($i = 1; $i -le [int]$env:REPEATS; $i++) {
            $runId = "${{ github.run_id }}-$i"
            Write-Host "=== Run $i of $env:REPEATS ($env:IMPLEMENTATION, $runId) ==="
            & .venv-mqtt-load\Scripts\python.exe tests/load/mqtt/mqtt_load_test.py `
              --devices tests/support/mqtt/load-devices.txt `
              --label $env:IMPLEMENTATION --run-id $runId `
              --period $env:PERIOD --duration $env:DURATION --warmup $env:WARMUP `
              --schedule $env:SCHEDULE --containers $containers `
              --resource-sample-interval 5
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) {
            Write-Host "$failed of $env:REPEATS runs failed their thresholds; see summary.md in each run folder."
            exit 1
          }

      - name: Revoke temporary credentials and delete the device file
        if: always()
        shell: cmd
        run: |
          if not exist .venv-mqtt-load\Scripts\python.exe (
            echo No Python environment; nothing was provisioned.
            exit /b 0
          )
          .venv-mqtt-load\Scripts\python.exe tests/support/mqtt/provision_mqtt_fleet.py --revoke

      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-load-test-${{ inputs.implementation }}-${{ github.run_id }}
          path: load-test-results/
          if-no-files-found: warn
