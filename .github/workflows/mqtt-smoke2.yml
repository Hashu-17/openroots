name: MQTT smoke test (Linux)

on:
  
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mqtt-smoke-linux:
    runs-on: [self-hosted, linux, x64, openroots-smoke]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Create Python environment and install MQTT client
        shell: bash
        run: |
          python -m venv .venv-mqtt-smoke
          .venv-mqtt-smoke/bin/python -m pip install -r examples/requirements-mqtt.txt

      - name: Publish telemetry and verify backend persistence
        shell: bash
        run: .venv-mqtt-smoke/bin/python examples/mqtt_smoke_test.py
        env:
          MQTT_SMOKE_DEVICE_ID: ${{ secrets.MQTT_SMOKE_DEVICE_ID }}
          MQTT_SMOKE_DEVICE_PASSWORD: ${{ secrets.MQTT_SMOKE_DEVICE_PASSWORD }}
          OPENROOTS_MQTT_HOST: 127.0.0.1
          OPENROOTS_MQTT_PORT: 1883
          OPENROOTS_API_URL: http://127.0.0.1:8080
          MQTT_SMOKE_CHANNEL: temperature
          MQTT_SMOKE_TIMEOUT: 30
