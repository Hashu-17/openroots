# Pull-request gate: build and test everything on GitHub-hosted runners.
# Every job here should be a required status check in branch protection.
# Black-box MQTT smoke/load tests are not here: they need a running stack and
# live in mqtt-smoke.yml / mqtt-load-test.yml (manual, self-hosted).
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - spring-mqtt-ingestion
      - go-mqtt-ingestion
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests (*Test, Surefire) and integration tests (*IT, Failsafe +
      # Testcontainers; the runner provides Docker). Also compiles the
      # OpenAPI-generated interfaces, so a broken docs/openapi.yaml fails here.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Build only, no push: catches broken Dockerfiles before they reach a deploy.
      - name: Build backend image
        run: docker build --tag openroots-backend:ci .

      - name: Build frontend image
        run: docker build --tag openroots-frontend:ci frontend
