name: MQTT smoke test

on:
  
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mqtt-smoke:
    runs-on: [self-hosted, Windows, X64, openroots-smoke]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Create Python environment and install MQTT client
        shell: cmd
        run: |
          if not exist "%USERPROFILE%\anaconda3\python.exe" (
            echo Python not found at %USERPROFILE%\anaconda3\python.exe
            exit /b 1
          )
          "%USERPROFILE%\anaconda3\python.exe" -m venv .venv-mqtt-smoke
          .venv-mqtt-smoke\Scripts\python.exe -m pip install -r tests/support/mqtt/requirements-mqtt.txt
      - name: Publish telemetry and verify backend persistence
        shell: cmd
        run: .venv-mqtt-smoke\Scripts\python.exe tests/e2e/mqtt/mqtt_smoke_test.py
        env:
          MQTT_SMOKE_DEVICE_ID: ${{ secrets.MQTT_SMOKE_DEVICE_ID }}
          MQTT_SMOKE_DEVICE_PASSWORD: ${{ secrets.MQTT_SMOKE_DEVICE_PASSWORD }}
          OPENROOTS_MQTT_HOST: 192.168.29.147
          OPENROOTS_MQTT_PORT: 1883
          OPENROOTS_API_URL: http://127.0.0.1:8080
          MQTT_SMOKE_CHANNEL: temperature
          MQTT_SMOKE_TIMEOUT: 30
