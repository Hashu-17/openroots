name: MQTT smoke test

# Manual only: it needs the local stack running on the self-hosted runner.
# Never add pull_request here; a PR's code would run on that machine.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mqtt-smoke-windows
  cancel-in-progress: false

jobs:
  mqtt-smoke:
    runs-on: [self-hosted, Windows, X64, openroots-smoke]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Create Python environment and install MQTT client
        shell: cmd
        env:
          # Set repo variable SMOKE_PYTHON (Settings > Variables) to a python.exe
          # the runner service account can read; otherwise python on PATH is used.
          SMOKE_PYTHON: ${{ vars.SMOKE_PYTHON }}
        run: |
          if "%SMOKE_PYTHON%"=="" (
            for /f "delims=" %%i in ('where python 2^>nul') do if not defined SMOKE_PYTHON set "SMOKE_PYTHON=%%i"
          )
          if "%SMOKE_PYTHON%"=="" (
            echo Python not found. Set the SMOKE_PYTHON repo variable or put python on the runner PATH.
            exit /b 1
          )
          if not exist "%SMOKE_PYTHON%" (
            echo Python not found at %SMOKE_PYTHON%
            exit /b 1
          )
          "%SMOKE_PYTHON%" -m venv .venv-mqtt-smoke
          .venv-mqtt-smoke\Scripts\python.exe -m pip install -r tests/support/mqtt/requirements-mqtt.txt
      - name: Publish telemetry and verify backend persistence
        shell: cmd
        run: .venv-mqtt-smoke\Scripts\python.exe tests/e2e/mqtt/mqtt_smoke_test.py
        env:
          MQTT_SMOKE_DEVICE_ID: ${{ secrets.MQTT_SMOKE_DEVICE_ID }}
          MQTT_SMOKE_DEVICE_PASSWORD: ${{ secrets.MQTT_SMOKE_DEVICE_PASSWORD }}
          OPENROOTS_MQTT_HOST: 192.168.29.147
          OPENROOTS_MQTT_PORT: 1883
          OPENROOTS_API_URL: http://127.0.0.1:8080
          MQTT_SMOKE_CHANNEL: temperature
          MQTT_SMOKE_TIMEOUT: 30
