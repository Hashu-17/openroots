openapi: 3.0.3
info:
  title: OpenRoots API
  version: 0.1.0
  description: REST API for the OpenRoots self-hosted IoT platform.
servers:
  - url: http://localhost:8080
tags:
  - name: Authentication
  - name: Devices
  - name: Telemetry
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and receive a JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      security: []
      responses:
        '200':
          description: Projects returned
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get a project
      operationId: getProject
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project returned
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{projectId}/devices:
    get:
      tags: [Devices]
      summary: List project devices
      operationId: listDevices
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Devices returned
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
      summary: Register a device with sensors
      tags: [Devices]
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: Device registered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/projects/{projectId}/devices/{deviceId}:
    get:
      tags: [Devices]
      summary: Get a project device and its sensors
      operationId: getDevice
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device returned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/telemetry:
    get:
      tags: [Telemetry]
      summary: List telemetry
      operationId: listTelemetry
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Telemetry returned
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Telemetry]
      summary: Ingest telemetry
      operationId: ingestTelemetry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryIngestRequest'
      responses:
        '201':
          description: Telemetry accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      $ref: '#/components/schemas/RegisterRequest'
    AuthResponse:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
    DeviceCreateRequest:
      type: object
      required: [name, type, sensors]
      properties:
        name:
          type: string
        type:
          type: string
        sensors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SensorCreateRequest'
    SensorCreateRequest:
      type: object
      required: [channelName]
      properties:
        channelName:
          type: string
        unit:
          type: string
    ProjectResponse:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    SensorResponse:
      allOf:
        - $ref: '#/components/schemas/SensorCreateRequest'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    DeviceResponse:
      type: object
      required: [id, projectId, name, type, status, registeredAt, sensors]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        status:
          type: string
        registeredAt:
          type: string
          format: date-time
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/SensorResponse'
    TelemetryIngestRequest:
      type: object
      required: [deviceId, capturedAt, payload]
      properties:
        deviceId:
          type: string
          format: uuid
        capturedAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Request validation failed
    Unauthorized:
      description: Authentication required or invalid
    Forbidden:
      description: Authenticated user is not allowed to perform this operation
    NotFound:
      description: Resource not found