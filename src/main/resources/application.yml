spring:
  application:
    name: iot-backend
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iot_backend}
    username: ${SPRING_DATASOURCE_USERNAME:iot_backend}
    password: ${SPRING_DATASOURCE_PASSWORD:iot_backend}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

openroots:
  jwt:
    # Base64-encoded HMAC key, at least 32 bytes. No default here on purpose: the app
    # refuses to start outside the dev profile without OPENROOTS_JWT_SECRET.
    secret: ${OPENROOTS_JWT_SECRET}
    expiration: ${OPENROOTS_JWT_EXPIRATION:PT15M}
  bootstrap:
    admin:
      # Creates the first platform administrator at startup when none exists.
      # Leave empty to skip. Remove the password from the environment after first login.
      email: ${OPENROOTS_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${OPENROOTS_BOOTSTRAP_ADMIN_PASSWORD:}
  live:
    # Browser origins allowed to open the live telemetry WebSocket.
    allowed-origins: ${OPENROOTS_LIVE_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  mqtt:
    url: ${OPENROOTS_MQTT_URL:tcp://localhost:1883}
    username: ${OPENROOTS_MQTT_USERNAME:}
    password: ${OPENROOTS_MQTT_PASSWORD:}
    topic: ${OPENROOTS_MQTT_TOPIC:openroots/v1/devices/+/telemetry}
    # Keeps each device's Mosquitto login in step with its credentials. Enabled in Compose.
    provisioning-enabled: ${OPENROOTS_MQTT_PROVISIONING_ENABLED:false}
    broker-host: ${OPENROOTS_MQTT_BROKER_HOST:localhost}
    broker-port: ${OPENROOTS_MQTT_BROKER_PORT:1883}
    admin-username: ${OPENROOTS_MQTT_ADMIN_USERNAME:}
    admin-password: ${OPENROOTS_MQTT_ADMIN_PASSWORD:}
    response-timeout-seconds: 5
    # How often to disable broker logins whose credential has expired.
    expiry-check-interval: ${OPENROOTS_MQTT_EXPIRY_CHECK_INTERVAL:PT1M}
    consumer:
      core-pool-size: ${OPENROOTS_MQTT_CORE_POOL_SIZE:4}
      max-pool-size: ${OPENROOTS_MQTT_MAX_POOL_SIZE:10}
      queue-capacity: ${OPENROOTS_MQTT_QUEUE_CAPACITY:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true