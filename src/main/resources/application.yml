spring:
  application:
    name: iot-backend
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iot_backend}
    username: ${SPRING_DATASOURCE_USERNAME:iot_backend}
    password: ${SPRING_DATASOURCE_PASSWORD:iot_backend}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

openroots:
  jwt:
    secret: ${OPENROOTS_JWT_SECRET:b3BlbnJvb3RzLWRldmVsb3BtZW50LWp3dC1zZWNyZXQtdGhpcnR5LXR3by1ieXRlcw==}
    expiration: ${OPENROOTS_JWT_EXPIRATION:PT15M}