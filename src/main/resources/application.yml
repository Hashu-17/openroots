spring:
  application:
    name: iot-backend
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iot_backend}
    username: ${SPRING_DATASOURCE_USERNAME:iot_backend}
    password: ${SPRING_DATASOURCE_PASSWORD:iot_backend}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

openroots:
  jwt:
    # Base64-encoded HMAC key, at least 32 bytes. No default here on purpose: the app
    # refuses to start outside the dev profile without OPENROOTS_JWT_SECRET.
    secret: ${OPENROOTS_JWT_SECRET}
    expiration: ${OPENROOTS_JWT_EXPIRATION:PT15M}
  bootstrap:
    admin:
      # Creates the first platform administrator at startup when none exists.
      # Leave empty to skip. Remove the password from the environment after first login.
      email: ${OPENROOTS_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${OPENROOTS_BOOTSTRAP_ADMIN_PASSWORD:}
  ingestion:
    # Shared key the Go ingestion service sends to read the device registry.
    # Empty disables the registry endpoint (every request gets 401).
    registry-api-key: ${OPENROOTS_INGESTION_REGISTRY_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true