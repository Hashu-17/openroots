openapi: 3.0.3
info:
  title: OpenRoots API
  version: 0.1.0
  description: REST API for the OpenRoots self-hosted IoT platform.
servers:
  - url: http://localhost:8080
tags:
  - name: Projects
  - name: Devices
paths:
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      security: []
      responses:
        '200':
          description: Projects returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListApiResponse'
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get a project
      operationId: getProject
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{projectId}/devices:
    get:
      tags: [Devices]
      summary: List devices in a project
      operationId: listDevices
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Devices returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Devices]
      summary: Register a device with sensors
      description: >-
        Creates a device and its sensors. When MQTT provisioning is enabled,
        the response includes device credentials and a publish topic. The
        generated password is returned once and is not stored for later retrieval.
      operationId: registerDevice
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistrationApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{projectId}/devices/{deviceId}:
    get:
      tags: [Devices]
      summary: Get a project device and its sensors
      operationId: getDevice
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Devices]
      summary: Delete a device and revoke its MQTT credential
      operationId: deleteDevice
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDeviceApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ApiResponseFields:
      type: object
      required: [success, message, timestamp]
      properties:
        success:
          type: boolean
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    ProjectResponse:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    SensorCreateRequest:
      type: object
      required: [channelName]
      properties:
        channelName:
          type: string
          minLength: 1
        unit:
          type: string
          nullable: true
    SensorResponse:
      allOf:
        - $ref: '#/components/schemas/SensorCreateRequest'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    DeviceCreateRequest:
      type: object
      required: [name, type, sensors]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        sensors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SensorCreateRequest'
    DeviceResponse:
      type: object
      required: [id, projectId, name, type, status, registeredAt, sensors]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        status:
          type: string
        registeredAt:
          type: string
          format: date-time
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/SensorResponse'
    ProjectListApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseFields'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProjectResponse'
    ProjectApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseFields'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ProjectResponse'
    DeviceListApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseFields'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DeviceResponse'
    DeviceApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseFields'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DeviceResponse'
    DeviceRegistrationResponse:
      type: object
      required: [device, mqttCredentials]
      properties:
        device:
          $ref: '#/components/schemas/DeviceResponse'
        mqttCredentials:
          type: object
          nullable: true
          description: Null when MQTT provisioning is disabled.
          required: [username, password, publishTopic]
          properties:
            username:
              type: string
              format: uuid
            password:
              type: string
            publishTopic:
              type: string
    DeviceRegistrationApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseFields'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DeviceRegistrationResponse'
    DeleteDeviceApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseFields'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              nullable: true
  responses:
    BadRequest:
      description: Request validation failed
    NotFound:
      description: Project or device not found
