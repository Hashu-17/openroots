services:
  database:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: iot-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bound to localhost only: the backend reaches the database over the Compose network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: openroots-mosquitto
    environment:
      MQTT_ADMIN_USERNAME: ${MQTT_ADMIN_USERNAME:-openroots-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Set MQTT_ADMIN_PASSWORD in .env}
      MQTT_INGESTOR_USERNAME: ${MQTT_INGESTOR_USERNAME:-telemetry-ingestor-spring}
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?Set MQTT_INGESTOR_PASSWORD in .env}
    command: ["/bin/sh", "/mosquitto/config/start-broker.sh"]
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_ctrl -h 127.0.0.1 -u \"$${MQTT_ADMIN_USERNAME}\" -P \"$${MQTT_ADMIN_PASSWORD}\" dynsec getDefaultACLAccess publishClientSend >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-backend
    environment:
      # Safe by default: the dev profile (seeded demo account) must be opted into via .env.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OPENROOTS_JWT_SECRET: ${OPENROOTS_JWT_SECRET:?Set OPENROOTS_JWT_SECRET in .env (base64, 32+ bytes)}
      OPENROOTS_BOOTSTRAP_ADMIN_EMAIL: ${OPENROOTS_BOOTSTRAP_ADMIN_EMAIL:-}
      OPENROOTS_BOOTSTRAP_ADMIN_PASSWORD: ${OPENROOTS_BOOTSTRAP_ADMIN_PASSWORD:-}
      OPENROOTS_MQTT_URL: tcp://mosquitto:1883
      OPENROOTS_MQTT_USERNAME: ${MQTT_INGESTOR_USERNAME:-telemetry-ingestor-spring}
      OPENROOTS_MQTT_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?Set MQTT_INGESTOR_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openroots-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
  mosquitto_data: