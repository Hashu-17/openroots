services:
  database:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: iot-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:2.1.2
    container_name: openroots-mosquitto
    environment:
      MQTT_ADMIN_USERNAME: ${MQTT_ADMIN_USERNAME:-openroots-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Set MQTT_ADMIN_PASSWORD in .env}
      MQTT_INGESTOR_USERNAME: ${MQTT_INGESTOR_USERNAME:-telemetry-ingestor}
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?Set MQTT_INGESTOR_PASSWORD in .env}
    command: ["/bin/sh", "/mosquitto/config/start-broker.sh"]
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_ctrl -h 127.0.0.1 -u \"$${MQTT_ADMIN_USERNAME}\" -P \"$${MQTT_ADMIN_PASSWORD}\" dynsec getDefaultACLAccess publishClientSend >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OPENROOTS_MQTT_PROVISIONING_ENABLED: "true"
      OPENROOTS_MQTT_BROKER_HOST: mosquitto
      OPENROOTS_MQTT_BROKER_PORT: 1883
      OPENROOTS_MQTT_ADMIN_USERNAME: ${MQTT_ADMIN_USERNAME:-openroots-admin}
      OPENROOTS_MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Set MQTT_ADMIN_PASSWORD in .env}
      OPENROOTS_INGESTION_REGISTRY_API_KEY: ${INGESTION_REGISTRY_API_KEY:?Set INGESTION_REGISTRY_API_KEY in .env}
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: openroots-ingestion
    environment:
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_INGESTOR_USERNAME:-telemetry-ingestor}
      MQTT_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?Set MQTT_INGESTOR_PASSWORD in .env}
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REGISTRY_URL: http://backend:8080/internal/v1/ingestion/device-registry
      REGISTRY_API_KEY: ${INGESTION_REGISTRY_API_KEY:?Set INGESTION_REGISTRY_API_KEY in .env}
      INGESTION_HTTP_ADDR: :8081
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INGESTION_PORT:-8081}:8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openroots-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
  mosquitto_data:
