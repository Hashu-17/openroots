<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRoots · Telemetry viewer</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #101416; color: #e7ebe7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1100px, calc(100% - 32px)); margin: 40px auto; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    p { color: #91a09c; }
    form, .toolbar, .panel { border: 1px solid #2a3939; background: #151d1f; padding: 18px; margin: 18px 0; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; align-items: end; }
    label { display: grid; gap: 5px; color: #91a09c; font-size: .8rem; }
    input, button { min-height: 40px; padding: 8px 10px; color: inherit; background: #101719; border: 1px solid #3b4a49; border-radius: 2px; }
    input:focus { outline: 2px solid #41c7a1; outline-offset: 1px; }
    button { cursor: pointer; background: #1b302d; border-color: #416b60; }
    button:hover { border-color: #41c7a1; }
    button:disabled { opacity: .5; cursor: wait; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    #connection { color: #e6b85a; }
    #message { min-height: 1.5em; color: #e6b85a; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 9px 12px; border-bottom: 1px solid #293536; white-space: nowrap; }
    th { color: #91a09c; font-size: .75rem; text-transform: uppercase; }
    td.value { color: #e6b85a; font-family: ui-monospace, monospace; }
    @media (max-width: 560px) { main { width: min(100% - 20px, 1100px); margin-top: 20px; } form, .panel { padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <h1>Telemetry viewer</h1>
    <p>Development viewer for bounded history and committed live readings from Go ingestion.</p>
    <form id="history-form">
      <label>Device UUID
        <input id="device-id" autocomplete="off" placeholder="registered device UUID" required>
      </label>
      <label>From
        <input id="from" type="datetime-local" required>
      </label>
      <label>To
        <input id="to" type="datetime-local" required>
      </label>
      <button id="load" type="submit">Load history</button>
    </form>
    <div class="toolbar">
      <button id="connect" type="button">Connect live</button>
      <button id="disconnect" type="button" disabled>Disconnect</button>
      <button id="more" type="button" disabled>Load more history</button>
      <span id="connection">Live disconnected</span>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <section class="panel table-wrap" aria-label="Telemetry readings">
      <table>
        <thead><tr><th>Recorded at</th><th>Channel</th><th>Value</th><th>Sensor UUID</th></tr></thead>
        <tbody id="readings"></tbody>
      </table>
    </section>
  </main>
  <script>
    const form = document.querySelector('#history-form')
    const deviceInput = document.querySelector('#device-id')
    const fromInput = document.querySelector('#from')
    const toInput = document.querySelector('#to')
    const readings = document.querySelector('#readings')
    const message = document.querySelector('#message')
    const connectionStatus = document.querySelector('#connection')
    const loadButton = document.querySelector('#load')
    const moreButton = document.querySelector('#more')
    const connectButton = document.querySelector('#connect')
    const disconnectButton = document.querySelector('#disconnect')
    let nextCursor = ''
    let socket = null
    let activeDevice = ''

    function toLocalInput(date) {
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000)
      return local.toISOString().slice(0, 16)
    }

    const now = new Date()
    toInputValue(fromInput, new Date(now.getTime() - 24 * 60 * 60 * 1000))
    toInputValue(toInput, now)
    function toInputValue(input, value) { input.value = toLocalInput(value) }

    function appendReading(reading, live = false) {
      const row = document.createElement('tr')
      const recorded = document.createElement('td')
      const channel = document.createElement('td')
      const value = document.createElement('td')
      const sensor = document.createElement('td')
      recorded.textContent = new Date(reading.recordedAt).toLocaleString()
      channel.textContent = reading.channelName
      value.textContent = String(reading.value)
      value.className = 'value'
      sensor.textContent = reading.sensorId
      if (live) row.dataset.live = 'true'
      row.append(recorded, channel, value, sensor)
      if (live) readings.prepend(row)
      else readings.append(row)
      while (readings.children.length > 500) {
        if (live) readings.lastElementChild.remove()
        else readings.firstElementChild.remove()
      }
    }

    function rangeQuery() {
      const from = new Date(fromInput.value)
      const to = new Date(toInput.value)
      if (!Number.isFinite(from.getTime()) || !Number.isFinite(to.getTime()) || from >= to) {
        throw new Error('Choose a valid range where From is earlier than To.')
      }
      if (to - from > 31 * 24 * 60 * 60 * 1000) throw new Error('History range cannot exceed 31 days.')
      return { from: from.toISOString(), to: to.toISOString() }
    }

    async function fetchHistory(cursor = '') {
      const deviceId = deviceInput.value.trim()
      if (!deviceId) throw new Error('Enter a registered device UUID.')
      const range = rangeQuery()
      const params = new URLSearchParams({ ...range, limit: '500' })
      if (cursor) params.set('cursor', cursor)
      const response = await fetch(`/api/v1/devices/${encodeURIComponent(deviceId)}/telemetry?${params}`)
      const body = await response.json()
      if (!response.ok) throw new Error(body.error || `History request failed (${response.status}).`)
      for (const reading of body.readings) appendReading(reading)
      nextCursor = body.nextCursor || ''
      moreButton.disabled = !nextCursor
      message.textContent = `${body.readings.length} readings loaded.`
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      loadButton.disabled = true
      message.textContent = 'Loading history…'
      readings.replaceChildren()
      nextCursor = ''
      moreButton.disabled = true
      try { await fetchHistory() } catch (error) { message.textContent = error.message }
      finally { loadButton.disabled = false }
    })

    moreButton.addEventListener('click', async () => {
      if (!nextCursor) return
      moreButton.disabled = true
      try { await fetchHistory(nextCursor) } catch (error) { message.textContent = error.message }
      finally { moreButton.disabled = !nextCursor }
    })

    connectButton.addEventListener('click', () => {
      const deviceId = deviceInput.value.trim()
      if (!deviceId) { message.textContent = 'Enter a registered device UUID first.'; return }
      if (socket && socket.readyState < WebSocket.CLOSING) socket.close()
      activeDevice = deviceId
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'
      socket = new WebSocket(`${protocol}//${location.host}/api/v1/devices/${encodeURIComponent(deviceId)}/telemetry/live`)
      connectionStatus.textContent = 'Connecting…'
      socket.addEventListener('open', () => {
        connectionStatus.textContent = `Live connected · ${activeDevice}`
        connectButton.disabled = true
        disconnectButton.disabled = false
      })
      socket.addEventListener('message', (event) => {
        try { appendReading(JSON.parse(event.data), true) }
        catch { message.textContent = 'Received an invalid live event.' }
      })
      socket.addEventListener('error', () => { message.textContent = 'Live connection failed.' })
      socket.addEventListener('close', () => {
        connectionStatus.textContent = 'Live disconnected'
        connectButton.disabled = false
        disconnectButton.disabled = true
      })
    })

    disconnectButton.addEventListener('click', () => socket?.close())
  </script>
</body>
</html>
