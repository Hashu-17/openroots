<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRoots · Telemetry viewer</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #101416; color: #e7ebe7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1200px, calc(100% - 32px)); margin: 40px auto; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    p { color: #91a09c; }
    form, .toolbar, .panel { border: 1px solid #2a3939; background: #151d1f; padding: 18px; margin: 18px 0; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; align-items: end; }
    label { display: grid; gap: 5px; color: #91a09c; font-size: .8rem; }
    select, button { min-height: 40px; padding: 8px 10px; color: inherit; background: #101719; border: 1px solid #3b4a49; border-radius: 2px; }
    select:focus { outline: 2px solid #41c7a1; outline-offset: 1px; }
    button { cursor: pointer; background: #1b302d; border-color: #416b60; }
    button:hover { border-color: #41c7a1; }
    button:disabled, select:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    #connection { color: #e6b85a; }
    #message { min-height: 1.5em; color: #e6b85a; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 640px; }
    th, td { padding: 9px 12px; border-bottom: 1px solid #293536; vertical-align: top; }
    th { color: #91a09c; font-size: .75rem; text-transform: uppercase; }
    th:first-child, td:first-child { white-space: nowrap; }
    th small { display: block; margin-top: 3px; color: #687976; font: 10px/1.4 ui-monospace, monospace; text-transform: none; }
    td.value { color: #e6b85a; font-family: ui-monospace, monospace; }
    tr[data-live="true"] td:first-child::after { content: ' · live'; color: #41c7a1; font-size: .75rem; }
    @media (max-width: 560px) { main { width: min(100% - 20px, 1200px); margin-top: 20px; } form, .panel { padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <h1>Telemetry viewer</h1>
    <p>History shows the last 24 hours. Readings captured together appear in one row.</p>
    <form id="history-form">
      <label>Project
        <select id="project-id" required disabled>
          <option value="">Loading projects…</option>
        </select>
      </label>
      <label>Device
        <select id="device-id" required disabled>
          <option value="">Select a project first</option>
        </select>
      </label>
      <button id="load" type="submit" disabled>Load history</button>
    </form>
    <div class="toolbar">
      <button id="connect" type="button" disabled>Connect live</button>
      <button id="disconnect" type="button" disabled>Disconnect</button>
      <button id="more" type="button" disabled>Load more history</button>
      <span id="connection">Live disconnected</span>
    </div>
    <p id="message" role="status" aria-live="polite">Loading registered projects and devices…</p>
    <section class="panel table-wrap" aria-label="Telemetry readings">
      <table>
        <thead><tr id="reading-headers"><th>Recorded at</th></tr></thead>
        <tbody id="readings"></tbody>
      </table>
    </section>
  </main>
  <script>
    const form = document.querySelector('#history-form')
    const projectSelect = document.querySelector('#project-id')
    const deviceSelect = document.querySelector('#device-id')
    const readings = document.querySelector('#readings')
    const headers = document.querySelector('#reading-headers')
    const message = document.querySelector('#message')
    const connectionStatus = document.querySelector('#connection')
    const loadButton = document.querySelector('#load')
    const moreButton = document.querySelector('#more')
    const connectButton = document.querySelector('#connect')
    const disconnectButton = document.querySelector('#disconnect')
    const rowsByTimestamp = new Map()
    let projects = []
    let currentDevice = null
    let nextCursor = ''
    let activeRange = null
    let socket = null
    let activeDevice = ''

    function closeLive() {
      if (socket && socket.readyState < WebSocket.CLOSING) socket.close()
      socket = null
      connectionStatus.textContent = 'Live disconnected'
      connectButton.disabled = !deviceSelect.value
      disconnectButton.disabled = true
    }

    function clearReadings() {
      readings.replaceChildren()
      rowsByTimestamp.clear()
      nextCursor = ''
      activeRange = null
      moreButton.disabled = true
    }

    function selectedDevice() {
      return currentDevice && currentDevice.deviceId === deviceSelect.value ? currentDevice : null
    }

    function drawHeaders(device) {
      headers.replaceChildren()
      const recorded = document.createElement('th')
      recorded.textContent = 'Recorded at'
      headers.append(recorded)
      for (const sensor of [...device.sensors].sort((a, b) => a.channelName.localeCompare(b.channelName))) {
        const header = document.createElement('th')
        const channel = document.createElement('span')
        channel.textContent = sensor.unit ? `${sensor.channelName} (${sensor.unit})` : sensor.channelName
        const id = document.createElement('small')
        id.textContent = sensor.sensorId
        header.append(channel, id)
        headers.append(header)
      }
    }

    function setDevice(deviceId) {
      closeLive()
      clearReadings()
      currentDevice = projects.flatMap(project => project.devices).find(device => device.deviceId === deviceId) || null
      if (!currentDevice) {
        headers.innerHTML = '<th>Recorded at</th>'
        loadButton.disabled = true
        connectButton.disabled = true
        return
      }
      drawHeaders(currentDevice)
      loadButton.disabled = false
      connectButton.disabled = false
      message.textContent = `${currentDevice.name} selected. History covers the last 24 hours.`
    }

    async function loadCatalog() {
      const response = await fetch('/api/v1/catalog')
      const body = await response.json()
      if (!response.ok) throw new Error(body.error || `Catalog request failed (${response.status}).`)

      const projectMap = new Map()
      for (const device of body.devices || []) {
        if (!projectMap.has(device.projectId)) {
          projectMap.set(device.projectId, { projectId: device.projectId, name: device.projectName, devices: [] })
        }
        projectMap.get(device.projectId).devices.push(device)
      }
      projects = [...projectMap.values()].sort((a, b) => a.name.localeCompare(b.name))
      projectSelect.replaceChildren(new Option('Select a project', ''))
      for (const project of projects) projectSelect.add(new Option(project.name, project.projectId))
      projectSelect.disabled = projects.length === 0
      projectSelect.value = ''
      deviceSelect.replaceChildren(new Option(projects.length ? 'Select a project first' : 'No registered devices', ''))
      message.textContent = projects.length ? 'Choose a project and device to view telemetry.' : 'No registered devices are available.'
    }

    function makeLastDayRange() {
      const to = new Date()
      const from = new Date(to.getTime() - 24 * 60 * 60 * 1000)
      return { from: from.toISOString(), to: to.toISOString() }
    }

    function appendReading(reading, live = false) {
      const device = selectedDevice()
      if (!device) return
      const timestamp = new Date(reading.recordedAt)
      if (!Number.isFinite(timestamp.getTime())) return
      const key = reading.recordedAt
      let group = rowsByTimestamp.get(key)
      if (!group) {
        const row = document.createElement('tr')
        row.dataset.timestamp = key
        const recorded = document.createElement('td')
        recorded.textContent = timestamp.toLocaleString()
        row.append(recorded)
        const cells = new Map()
        for (const sensor of [...device.sensors].sort((a, b) => a.channelName.localeCompare(b.channelName))) {
          const cell = document.createElement('td')
          cell.className = 'value'
          row.append(cell)
          cells.set(sensor.channelName, cell)
        }
        group = { row, cells }
        rowsByTimestamp.set(key, group)
        if (live) readings.prepend(row)
        else readings.append(row)
      }

      const cell = group.cells.get(reading.channelName)
      if (!cell) return
      cell.textContent = String(reading.value)
      if (live) group.row.dataset.live = 'true'
      while (readings.children.length > 500) {
        const oldest = live ? readings.lastElementChild : readings.firstElementChild
        rowsByTimestamp.delete(oldest.dataset.timestamp)
        oldest.remove()
      }
    }

    async function fetchHistory(cursor = '') {
      const deviceId = deviceSelect.value
      if (!deviceId) throw new Error('Choose a registered device.')
      if (!activeRange) activeRange = makeLastDayRange()
      const params = new URLSearchParams({ ...activeRange, limit: '500' })
      if (cursor) params.set('cursor', cursor)
      const response = await fetch(`/api/v1/devices/${encodeURIComponent(deviceId)}/telemetry?${params}`)
      const body = await response.json()
      if (!response.ok) throw new Error(body.error || `History request failed (${response.status}).`)
      for (const reading of body.readings) appendReading(reading)
      nextCursor = body.nextCursor || ''
      moreButton.disabled = !nextCursor
      message.textContent = `${body.readings.length} readings loaded from the last 24 hours.`
    }

    projectSelect.addEventListener('change', () => {
      closeLive()
      clearReadings()
      const project = projects.find(item => item.projectId === projectSelect.value)
      deviceSelect.replaceChildren(new Option(project ? 'Select a device' : 'Select a project first', ''))
      if (project) {
        for (const device of [...project.devices].sort((a, b) => a.name.localeCompare(b.name))) {
          deviceSelect.add(new Option(device.name, device.deviceId))
        }
        deviceSelect.disabled = false
      } else {
        deviceSelect.disabled = true
      }
      deviceSelect.value = ''
      setDevice('')
      message.textContent = project ? `Choose a device in ${project.name}.` : 'Choose a project and device to view telemetry.'
    })

    deviceSelect.addEventListener('change', () => {
      setDevice(deviceSelect.value)
    })

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      if (!selectedDevice()) { message.textContent = 'Choose a project and device first.'; return }
      closeLive()
      loadButton.disabled = true
      message.textContent = 'Loading the last 24 hours…'
      clearReadings()
      activeRange = makeLastDayRange()
      try { await fetchHistory() } catch (error) { message.textContent = error.message }
      finally { loadButton.disabled = false }
    })

    moreButton.addEventListener('click', async () => {
      if (!nextCursor) return
      moreButton.disabled = true
      try { await fetchHistory(nextCursor) } catch (error) { message.textContent = error.message }
      finally { moreButton.disabled = !nextCursor }
    })

    connectButton.addEventListener('click', () => {
      const deviceId = deviceSelect.value
      if (!deviceId) { message.textContent = 'Choose a project and device first.'; return }
      closeLive()
      activeDevice = deviceId
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'
      socket = new WebSocket(`${protocol}//${location.host}/api/v1/devices/${encodeURIComponent(deviceId)}/telemetry/live`)
      connectionStatus.textContent = 'Connecting…'
      socket.addEventListener('open', () => {
        connectionStatus.textContent = `Live connected · ${activeDevice}`
        connectButton.disabled = true
        disconnectButton.disabled = false
      })
      socket.addEventListener('message', (event) => {
        try { appendReading(JSON.parse(event.data), true) }
        catch { message.textContent = 'Received an invalid live event.' }
      })
      socket.addEventListener('error', () => { message.textContent = 'Live connection failed.' })
      socket.addEventListener('close', () => {
        connectionStatus.textContent = 'Live disconnected'
        connectButton.disabled = !deviceSelect.value
        disconnectButton.disabled = true
      })
    })

    disconnectButton.addEventListener('click', closeLive)
    loadCatalog().catch(error => {
      projectSelect.replaceChildren(new Option('Catalog unavailable', ''))
      message.textContent = error.message
    })
  </script>
</body>
</html>
